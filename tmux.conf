set-option -sa terminal-overrides ",xterm*:Tc"

unbind C-b
set -g prefix C-a
bind C-a send-prefix

bind -n M-[ previous-window
bind -n M-] next-window

set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set -g allow-passthrough on

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'

set -g status-interval 15
unbind T

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi T send-keys -X copy-pipe-and-cancel "/Users/thong/.local/bin/tmux-translate-selection"

bind '"' split-window -v -c '#{pane_current_path}'
bind % split-window -h -c '#{pane_current_path}'

# Light theme
set -g status-style "bg=#f2f2f2,fg=#3c3c3c"
set -g status-left "#[fg=#3c3c3c,bold] #S "
set -g status-left-length 30
set -g status-right "#[fg=#6b6b6b] %H:%M  %d-%b "
set -g status-right-length 40
set -g window-status-format "#[fg=#8a8a8a] #I #W "
set -g window-status-current-format "#[fg=#1f1f1f,bg=#dcdcdc,bold] #I #W "
set -g window-status-separator ""
set -g window-status-activity-style "fg=#b35c00,bg=#f2f2f2"
set -g window-status-bell-style "fg=#c0392b,bg=#f2f2f2"
# --- Active pane visibility ---
# Neutral borders: no highlight on the active pane
set -g pane-border-lines single
set -g pane-border-indicators off
set -g pane-border-style "fg=#3a3a3a"
set -g pane-active-border-style "fg=#3a3a3a"
set -g pane-border-status off
# Dim inactive panes (only affects default-colored text/background)
set -g window-style "fg=#8a8a8a,bg=#1a1b1e"
set -g window-active-style "fg=terminal,bg=terminal"
set -g message-style "bg=#f2f2f2,fg=#3c3c3c"
set -g message-command-style "bg=#f2f2f2,fg=#3c3c3c"
set -g mode-style "bg=#cfe3ff,fg=#1f1f1f"
set -g display-panes-colour "#d0d0d0"
set -g display-panes-active-colour "#4a90d9"
set -g clock-mode-colour "#4a90d9"

run '~/.tmux/plugins/tpm/tpm'
